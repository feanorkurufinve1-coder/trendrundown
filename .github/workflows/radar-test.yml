name: radar-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: |
          cd tools/trend_radar
          python3 trend_radar.py --quick --no-upload || true
          echo "=========== HEALTH"
          python3 -c "import json;d=json.load(open('radar.json'));print({k:(v['ok'],v['n']) for k,v in d['health'].items()});[print(c['score'],'|',c['term'],'|',c['kind'],'|','; '.join(c['why']),'|',c.get('ud',{}).get('gist','')[:60],'|',c.get('big')) for c in d['candidates'][:45]]"
