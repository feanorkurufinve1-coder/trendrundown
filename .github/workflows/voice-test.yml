name: Voice test
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "slug пояснения"
        default: "telerally"
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: pip install -q kokoro soundfile "piper-tts>=1.2"
      - run: python tools/voice_sample.py "${{ github.event.inputs.slug }}"
      - name: Save samples to branch voice-samples
        run: |
          cd voice_out
          git init -q && git checkout -q -b voice-samples
          git config user.name "voice-bot" && git config user.email "voice-bot@users.noreply.github.com"
          git add -A && git commit -q -m "voice samples"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voice-samples
