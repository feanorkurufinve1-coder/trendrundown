# Озвучка новых страниц голосом Michael (бесплатная модель Kokoro). Раз в час; сайт подхватит файлы при ближайшем обновлении.
name: Narrate

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: narrate
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/narrate.yml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro soundfile
      - run: python tools/narrate.py
      - name: Save
        run: |
          git config user.name "trendrundown-bot"
          git config user.email "bot@trendrundown.com"
          git add data/audio.json site/audio 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "audio update"
            for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
          fi
