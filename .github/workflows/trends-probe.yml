# Пробное скачивание «Сейчас в тренде» (Google Trends) с разбивкой запросов — запускается вручную; итог в ветку reports.
name: Trends probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -s -c jar -A "$UA" "https://trends.google.com/trending?geo=US&hours=24" -o page.html -w "page %{http_code}\n" >> codes.txt
          i=0
          for P in '[null,null,\"US\",0,\"en-US\",24,1]' '[null,null,\"US\",0,\"en\",24,1]' '[null,null,\"US\",0,\"en-US\",168,1]' '[\"US\",0,\"en-US\",24,1]' '[null,null,\"US\",[],\"en-US\",24,1]'; do
            i=$((i+1))
            curl -s -b jar -m 60 -A "$UA" "https://trends.google.com/_/TrendsUi/data/batchexecute?rpcids=i0OFE&source-path=%2Ftrending&hl=en-US&rt=c" \
              -H "Content-Type: application/x-www-form-urlencoded;charset=UTF-8" -H "Origin: https://trends.google.com" -H "Referer: https://trends.google.com/trending?geo=US" \
              --data-urlencode "f.req=[[[\"i0OFE\",\"$P\",null,\"generic\"]]]" -o b$i.txt -w "b$i %{http_code}\n" >> codes.txt
            head -c 600 b$i.txt > b${i}_head.txt
          done
          grep -o 'i0OFE[^"]\{0,200\}' page.html | head -5 > page_rpc.txt || true
          grep -o 'csv[^"]\{0,120\}' page.html | head -5 >> page_rpc.txt || true
          rm -f page.html
          wc -c *.txt >> codes.txt; head -c 3000 batch.txt > batch_head.txt; head -c 1500 daily.txt > daily_head.txt
          rm -f daily.txt rss.txt
      - run: |
          cd out && git init -q && git checkout -q -b reports
          git config user.name "probe-bot" && git config user.email "probe-bot@users.noreply.github.com"
          git add -A && git commit -q -m "trends probe" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" reports
