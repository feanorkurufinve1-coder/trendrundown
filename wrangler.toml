# Выкладка сайта на Cloudflare: статические файлы из папки site + worker.js (счётчики смайликов)
name = "trendrundown"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "trendrundown.com", custom_domain = true },
  { pattern = "www.trendrundown.com", custom_domain = true },
]

[triggers]
crons = ["*/15 * * * *"]          # будильник: запуск обновления сайта каждые 15 минут (см. scheduled в worker.js)

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true          # сначала worker: он переадресует www на основной адрес

[[durable_objects.bindings]]
name = "REACTIONS"
class_name = "Reactions"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Reactions"]
